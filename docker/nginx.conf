# YOLO 训练可视化平台 - 单容器 Nginx 配置
# 与 backend 同容器运行，proxy 直指 127.0.0.1:8000（无需 DNS 解析）
# 注意：不写 user 指令，nginx 以容器内 root 运行。
# (python:3.11-slim 未创建 nginx 系统用户，写 "user nginx;" 会导致 getpwnam 失败崩溃)

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 允许上传超大文件（数据集/视频，20GB 上限）
    client_max_body_size 20480m;

    # Gzip 压缩
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen       80;
        server_name  localhost;

        # 前端静态文件
        root   /usr/share/nginx/html;
        index  index.html;

        # 入口 HTML 绝不缓存：每次部署产物指纹都会变，浏览器若沿用旧 index.html，
        # 就会去请求已被删除的旧 chunk。配合下面的 /assets/ 规则，彻底杜绝
        # 「首页/模型管理点开白屏、报 MIME type text/html」这类缓存事故。
        # 只用 add_header，不叠加 expires：expires 会自己再生成一条 Cache-Control，
        # 两条同名头会让浏览器取值不确定。
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # 构建产物：文件名自带内容哈希，内容变则名变，可以放心长缓存。
        # 关键：必须 =404 兜底，**不能落到 SPA 的 index.html**——
        # 否则不存在的旧 JS 会返回 200 + HTML，浏览器报
        # "Failed to load module script: Expected a JavaScript module but
        #  the server responded with a MIME type of text/html"，
        # 而且因为是 200，这份 HTML 会被当成 JS 缓存下来，刷新也修不好。
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        # SPA 路由支持（所有非文件请求都返回 index.html）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 代理 - /prod-api/* 转发到本容器的后端
        location /prod-api/ {
            rewrite ^/prod-api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 大文件上传直接流式转发，不在 nginx 侧缓冲整包（避免 10G 上传把容器根盘写满）
            proxy_request_buffering off;

            # WebSocket 支持（用于日志流 SSE）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # SSE 支持
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # 静态文件代理 - /static/* 转发到本容器的后端
        location /static/ {
            proxy_pass http://127.0.0.1:8000/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 健康检查
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}