# YOLO 训练可视化平台 - 生产镜像部署（单容器）
# 镜像已包含：前端构建产物 + 后端 FastAPI + torch(CUDA 12.8) + 全部模型文件 + nginx
# 服务器零配置：无需上传代码/模型，拉取镜像即用
#
# 启动：
#   docker compose up -d   # 默认使用下方真实仓库地址，无需任何配置

services:
  # 统一镜像：一个容器同时提供前端(:80)与后端(:8000)
  yolo-platform:
    image: ${YOLO_IMAGE:-crpi-ujjfs42qeoqwaisn.cn-hangzhou.personal.cr.aliyuncs.com/yolo-main/yolo-platform:latest}
    container_name: yolo-platform
    restart: unless-stopped
    ports:
      - "3000:80"     # 前端（Nginx 托管）
      - "8000:8000"   # 后端 API（uvicorn）
    shm_size: '24gb'  # 增加共享内存大小以支持 PyTorch 多进程数据加载
    environment:
      # GPU 支持 - 继承宿主机 NVIDIA 驱动（需已安装 NVIDIA Container Toolkit）
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # 数据集持久化（训练数据）；模型已打进镜像 /app/models，不再挂载
      - yolo-data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 数据集持久化卷（重建容器不丢失数据）
volumes:
  yolo-data: